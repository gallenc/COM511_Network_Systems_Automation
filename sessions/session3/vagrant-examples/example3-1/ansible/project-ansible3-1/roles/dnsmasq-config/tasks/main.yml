---
    # Install required packages for dnsmasq
    - name: Install dnsmasq server packages
      ansible.builtin.apt:
        name:
          - dnsmasq
        state: present
        
      # Fix DNS resolution issues common in VirtualBox  {{hostvars[inventory_hostname].eth1_ip}}
      # see https://fabiorehm.com/blog/2025/08/25/bulletproof-ubuntu-desktop-vagrant-virtualbox/#4-fix-dns-resolution-first
      # 10.0.2.3  is the nameserver used in virtualbox NAT network, which is the default network for Vagrant boxes
    - name: remove systemd-resolved
      become: true
      ansible.builtin.shell: |
         systemctl stop systemd-resolved || true
         systemctl disable systemd-resolved || true
         systemctl mask systemd-resolved || true
         chattr -i /etc/resolv.conf 2>/dev/null || true
         rm -f /etc/resolv.conf
         printf 'nameserver {{hostvars[inventory_hostname].eth1_ip}}  # new dnsmasq nameserver \nnameserver 10.0.2.3   # nameserver used in virtualbox NAT network \n' > /etc/resolv.conf
         chattr +i /etc/resolv.conf
         exit 0
         
    # set up dnsmasq configuration for DHCP 
    - name: Deploy dnsmasq.conf
      ansible.builtin.template:
        src: ./templates/dnsmasq.conf.j2
        dest: /etc/dnsmasq.conf
        mode: '0644'
      notify: restart dnsmasq

    - name: Deploy DHCP reservations
      ansible.builtin.template:
        src: ./templates/dhcp-reservations.conf.j2
        dest: /etc/dnsmasq.d/reservations.conf
        mode: '0644'
      notify: restart dnsmasq
      
    - name: Capture DHCP reservations
      command: cat /etc/dnsmasq.d/reservations.conf
      register: dhcp_output

    - name: Display DHCP reservations to console
      debug:
        msg: "{{ dhcp_output.stdout_lines }}"

    # set up dnsmasq entires for local DNS resolution
    - name: Deploy local DNS entries
      ansible.builtin.template:
        src: ./templates/local-dns.conf.j2
        dest: /etc/dnsmasq.d/local-dns.conf
        mode: '0644'
      notify: restart dnsmasq
      
    - name: Capture local DNS entries
      command: cat /etc/dnsmasq.d/local-dns.conf
      register: dns_output

    - name: Display local DNS entries to console
      debug:
        msg: "{{ dns_output.stdout_lines }}"

    - name: Start Dnsmasq
      ansible.builtin.service:
        name: dnsmasq
        state: started
        enabled: true
